<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Learning Platform – Home</title>
  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }
    body{
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg,#4f8cff,#6ee7b7);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .card{
      width:100%;
      max-width:520px;
      background:#ffffff;
      border-radius:24px;
      box-shadow:0 22px 45px rgba(15,23,42,0.30);
      padding:30px 40px 32px;
      text-align:center;
    }
    h1{
      font-size:22px;
      font-weight:650;
      margin-bottom:6px;
      color:#111827;
    }
    .subtitle{
      font-size:13px;
      color:#6b7280;
      margin-bottom:24px;
    }
    .btn{
      display:block;
      width:100%;
      padding:12px 16px;
      margin-bottom:12px;
      border-radius:999px;
      border:none;
      background:#1d3f8b;
      color:#ffffff;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      text-decoration:none;
    }
    .btn:hover{
      background:#162f67;
    }
    .helper{
      margin-top:10px;
      font-size:11px;
      color:#6b7280;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>AI Supported Personalised Learning Platform</h1>
  <div class="subtitle">Select your role to continue</div>

  <!-- change href file names to match your project if needed -->
  <a class="btn" href="index.html">Student Registration</a>
  <a class="btn" href="student.html">Student Portal</a>
  <a class="btn" href="admin.html">Admin Dashboard</a>


</div>
</body>
</html>
